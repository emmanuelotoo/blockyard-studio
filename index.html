<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Blockyard Studio: build blocky 3D platformer courses in the browser, then play them.">
<title>Blockyard Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><b>Blockyard</b><span>studio</span></div>
    <button class="pill" id="worldBtn" aria-haspopup="menu"><span id="worldName">Clay Peaks</span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <div class="seg" role="group" aria-label="Mode">
      <button id="buildBtn" aria-pressed="true">Build</button>
      <button id="playBtn" aria-pressed="false">Play</button>
    </div>
    <span class="pill things" id="things">0 things</span>
    <div class="spacer"></div>
    <span class="saved" id="saved"><i></i><span>Saved on this device</span></span>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="panelBtn">Panel</button>
    <button class="btn" id="storeBtn">Store</button>
  </header>
  <div class="main">
    <nav class="rail" aria-label="Tools">
      <button data-tool="select" data-tip="Select (V)" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
      <button data-tool="place" data-tip="Place (B)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
      <button data-tool="paint" data-tip="Paint (P)"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 4-1.5 4-3.5S6.5 13 5 14.5 2 20 4 20z"/><path d="M9 14l10-10 1.5 1.5-10 10"/></svg></button>
      <button data-tool="erase" data-tip="Erase (X)"><svg viewBox="0 0 24 24"><path d="M16 4l5 5-10 10H6l-3-3z"/><path d="M10 9l5 5M6 19h14"/></svg></button>
      <hr>
      <button data-act="undo" data-tip="Undo (Ctrl Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12h-2" transform="translate(0,-6)"/></svg></button>
      <button data-act="redo" data-tip="Redo (Ctrl Shift Z)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12h2" transform="translate(0,-6)"/></svg></button>
      <button data-act="frame" data-tip="Frame course (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <hr>
      <button data-tab="look" data-tip="Look"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-tab="char" data-tip="Character"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="7" rx="1"/><path d="M6 21v-7a2 2 0 012-2h8a2 2 0 012 2v7"/></svg></button>
      <button data-act="store" data-tip="Store"><svg viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 01-5.3 2 3 3 0 01-5.4 0A3 3 0 014 11z"/><path d="M5.5 13.5V20h13v-6.5"/></svg></button>
      <button data-tab="console" data-tip="Console"><svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M12 18h7"/></svg></button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="view" tabindex="0" aria-label="3D world view"></canvas>
      <div class="vignette" id="vignette"></div>
      <div class="flash" id="flash"></div>
      <div class="tip3d" id="tip3d"></div>
      <div class="card toolcard" id="toolcard"></div>
      <div class="hud"><div class="card" id="hud"></div></div>
      <div class="card playhint" id="playhint"><b>WASD</b> move&nbsp;&nbsp;<b>Space</b> jump, hold for height&nbsp;&nbsp;<b>Shift</b> dash&nbsp;&nbsp;<b>Drag</b> look&nbsp;&nbsp;<b>Esc</b> stop</div>
      <div class="card toast" id="toast"></div>
      <div class="touch" id="touch">
        <div class="joy" id="joy"><i></i></div>
        <div class="tbtns"><button id="tDash">Dash</button><button class="j" id="tJump">Jump</button></div>
      </div>
      <div class="finish"><div class="card"><h2>Course complete</h2><p id="finishText"></p><div class="btnrow" style="justify-content:center"><button class="btn primary" id="againBtn">Play again</button><button class="btn" id="backBtn">Back to build</button></div></div></div>
    </div>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="page" aria-selected="true">Page</button>
        <button role="tab" data-tab="look" aria-selected="false">Look</button>
        <button role="tab" data-tab="char" aria-selected="false">Character</button>
        <button role="tab" data-tab="console" aria-selected="false">Console</button>
        <button class="x btn ghost sm" id="panelClose" aria-label="Close panel">Close</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>

    <div class="store" id="store" role="dialog" aria-label="Store">
      <div class="store-top">
        <input id="storeSearch" placeholder="Search characters, bricks, nature, textures, looks…" aria-label="Search the store">
        <button class="btn" id="storeClose">Close</button>
      </div>
      <div class="store-chips" id="storeChips"></div>
      <div class="store-body" id="storeBody"></div>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
